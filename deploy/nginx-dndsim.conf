# dnd-sim — HTTP-only vhost for dndsim.lab980.com.
#
# This is the FALLBACK vhost: `dndsim setup` installs it as
# /etc/nginx/sites-available/dndsim.lab980.com only when lab980's
# `provision-site` is not on PATH (which normally writes the vhost, with the
# shared security-headers include, and runs certbot). Either way `dndsim
# setup` then keeps the marker-tagged SSE block below present in every
# proxied location — it rewrites the block in place, so edit it here, not in
# /etc/nginx. HTTP only on purpose: point DNS at the box, then
# `certbot --nginx -d dndsim.lab980.com --redirect` adds the 443 block and
# the redirect. Do not hand-write SSL blocks here.

server {
    listen 80;
    listen [::]:80;
    server_name dndsim.lab980.com;

    access_log /var/log/nginx/dndsim.access.log;
    error_log  /var/log/nginx/dndsim.error.log;

    # SSE transcripts can run long; a spectator tab holds one open connection.
    client_max_body_size 1m;

    location / {
        # --- SSE correctness: without the managed block below the stream is
        # --- buffered and the spectator sees nothing until the game ends (or
        # --- the proxy times out). Connection "" keeps the upstream on
        # --- keep-alive, not "upgrade"; gzip breaks event framing.
        proxy_pass http://127.0.0.1:8071;
        # dndsim-sse begin (managed by dndsim setup; do not edit between markers)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;
        # dndsim-sse end
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot drops its ACME challenge here when you run it later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
