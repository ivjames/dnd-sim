# dnd-sim — HTTP-only vhost for dndsim.lab980.com
#
# lab980 protocol: ship HTTP only. Point DNS at the box, verify this works over
# plain http, THEN run `certbot --nginx -d dndsim.lab980.com`, which rewrites
# this file to add the 443 server block and the redirect. Do not hand-write SSL
# blocks here — certbot will refuse or clobber them.
#
# Install:
#   sudo cp deploy/nginx-dndsim.conf /etc/nginx/sites-available/dndsim
#   sudo ln -s /etc/nginx/sites-available/dndsim /etc/nginx/sites-enabled/dndsim
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dndsim.lab980.com;

    access_log /var/log/nginx/dndsim.access.log;
    error_log  /var/log/nginx/dndsim.error.log;

    # SSE transcripts can run long; a spectator tab holds one open connection.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8071;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";          # keep-alive, not "upgrade"
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- SSE correctness: without these the stream is buffered and the
        # --- spectator sees nothing until the game ends (or the proxy times out).
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        gzip off;                                       # gzip breaks event framing
    }

    # certbot drops its ACME challenge here when you run it later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}
